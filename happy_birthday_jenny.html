<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>★ Happy 23rd Birthday Jenny!! ★</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Press Start 2P', monospace;
    background: #050014;
    color: #fff;
  }

  body {
    background:
      radial-gradient(ellipse at 20% 80%, #4a1d6e 0%, transparent 55%),
      radial-gradient(ellipse at 80% 25%, #2a1a5e 0%, transparent 55%),
      radial-gradient(ellipse at 50% 50%, #1a0a3e 0%, #050014 80%);
    position: relative;
  }

  /* ===== Nebula glow ===== */
  .nebula {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 15% 30%, rgba(255,100,200,0.18) 0%, transparent 22%),
      radial-gradient(circle at 85% 70%, rgba(120,150,255,0.15) 0%, transparent 28%),
      radial-gradient(circle at 50% 10%, rgba(200,100,255,0.12) 0%, transparent 32%),
      radial-gradient(circle at 60% 80%, rgba(255,180,220,0.10) 0%, transparent 30%);
    pointer-events: none;
    z-index: 1;
  }

  /* ===== Twinkling stars ===== */
  .stars {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 2;
  }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.5); }
    50%      { opacity: 1;   transform: scale(1.4); box-shadow: 0 0 6px currentColor; }
  }

  /* ===== Shooting stars ===== */
  .shooting-star {
    position: absolute;
    width: 140px; height: 2px;
    background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.9) 70%, white 100%);
    border-radius: 999px;
    filter: drop-shadow(0 0 6px white);
    opacity: 0;
    animation: shoot 7s linear infinite;
    z-index: 3;
  }
  .shooting-star::after {
    content: '';
    position: absolute;
    right: -2px; top: -3px;
    width: 8px; height: 8px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 12px 3px white, 0 0 22px 4px #ffd1dc;
  }
  @keyframes shoot {
    0%   { transform: translate(-180px, -80px) rotate(22deg); opacity: 0; }
    8%   { opacity: 1; }
    55%  { opacity: 1; }
    70%  { opacity: 0; }
    100% { transform: translate(110vw, 65vh) rotate(22deg); opacity: 0; }
  }

  /* ===== Title ===== */
  .title {
    position: absolute;
    top: 6%;
    width: 100%;
    text-align: center;
    font-size: clamp(14px, 2.4vw, 26px);
    color: #ffd1dc;
    letter-spacing: 3px;
    text-shadow:
      0 0 6px #ff8fa3,
      0 0 14px #fb6f92,
      0 0 24px rgba(251,111,146,0.6),
      3px 3px 0 #6b2c5a,
      -1px -1px 0 #fff;
    animation: titleGlow 2.4s ease-in-out infinite;
    z-index: 50;
    line-height: 1.6;
  }
  .title .heart {
    color: #ff4d8d;
    text-shadow: 0 0 10px #ff4d8d;
    display: inline-block;
    animation: heartBeat 1.2s ease-in-out infinite;
  }
  @keyframes titleGlow {
    0%, 100% { transform: scale(1);    filter: brightness(1); }
    50%      { transform: scale(1.04); filter: brightness(1.25); }
  }
  @keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.25); }
  }

  /* ===== Scene container ===== */
  .scene {
    position: absolute;
    bottom: 4%;
    left: 50%;
    transform: translateX(-50%);
    width: min(560px, 92vw);
    height: 520px;
    z-index: 10;
  }

  canvas {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    position: absolute;
  }

  /* ===== Cake ===== */
  #cake {
    width: 100%;
    height: 380px;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    z-index: 5;
    filter: drop-shadow(0 6px 22px rgba(255, 143, 163, 0.55));
  }

  /* ===== Angels ===== */
  .angel-wrap {
    position: absolute;
    width: 140px; height: 154px;
    top: 10px;
    z-index: 8;
    animation: hover 3.2s ease-in-out infinite;
    filter: drop-shadow(0 0 12px rgba(255, 230, 102, 0.55));
  }
  .angel-wrap.left  { left: 4%; }
  .angel-wrap.right { right: 4%; animation-delay: 1.6s; transform: scaleX(-1); }
  .angel-wrap canvas {
    width: 100%; height: 100%;
    left: 0; top: 0;
    animation: flap 0.7s steps(1, end) infinite;
  }
  .angel-wrap canvas.frame-2 { animation-delay: 0.35s; }
  @keyframes hover {
    0%, 100% { transform: translateY(0)    rotate(-2deg); }
    50%      { transform: translateY(-22px) rotate(2deg); }
  }
  /* mirror right angel + still hover */
  .angel-wrap.right { animation-name: hoverRight; }
  @keyframes hoverRight {
    0%, 100% { transform: translateY(0)    rotate(2deg)  scaleX(-1); }
    50%      { transform: translateY(-22px) rotate(-2deg) scaleX(-1); }
  }
  @keyframes flap {
    0%, 49%   { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  /* ===== Girl ===== */
  .girl-wrap {
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 130px;
    height: 230px;
    z-index: 15;
    filter: drop-shadow(0 0 10px rgba(255, 200, 220, 0.55));
  }
  #girl {
    width: 100%; height: 100%;
    left: 0; top: 0;
    animation: wishGlow 3s ease-in-out infinite;
  }
  @keyframes wishGlow {
    0%, 100% { filter: brightness(1); }
    50%      { filter: brightness(1.15) drop-shadow(0 0 12px rgba(255, 220, 140, 0.85)); }
  }

  /* ===== Butterflies ===== */
  .butterfly {
    position: absolute;
    width: 36px; height: 28px;
    z-index: 17;
  }
  .butterfly canvas {
    width: 100%; height: 100%;
    left: 0; top: 0;
    animation: bflyFlap 0.32s steps(1, end) infinite;
  }
  .butterfly canvas.frame-2 { animation-delay: 0.16s; }
  @keyframes bflyFlap {
    0%, 49%   { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
  .b1 { bottom: 35%; left: 8%;  animation: flyAround1 9s ease-in-out infinite; }
  .b2 { bottom: 55%; right: 6%; animation: flyAround2 11s ease-in-out infinite; }
  .b3 { bottom: 15%; left: 65%; animation: flyAround3 10s ease-in-out infinite; }
  @keyframes flyAround1 {
    0%,100%{transform:translate(0,0) rotate(-6deg);}
    25%{transform:translate(50px,-40px) rotate(6deg);}
    50%{transform:translate(110px,-10px) rotate(-4deg);}
    75%{transform:translate(60px,30px) rotate(4deg);}
  }
  @keyframes flyAround2 {
    0%,100%{transform:translate(0,0) rotate(4deg);}
    25%{transform:translate(-40px,30px) rotate(-6deg);}
    50%{transform:translate(-90px,0) rotate(6deg);}
    75%{transform:translate(-30px,-30px) rotate(-4deg);}
  }
  @keyframes flyAround3 {
    0%,100%{transform:translate(0,0) rotate(-3deg);}
    33%{transform:translate(-30px,-50px) rotate(8deg);}
    66%{transform:translate(40px,-30px) rotate(-8deg);}
  }

  /* ===== Confetti dots ===== */
  .confetti {
    position: absolute;
    width: 6px; height: 6px;
    z-index: 4;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0%   { transform: translateY(-20px) rotate(0deg);   opacity: 0; }
    10%  { opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0.6; }
  }

  /* ===== Footer message ===== */
  .message {
    position: absolute;
    bottom: 1.5%;
    width: 100%;
    text-align: center;
    font-size: 11px;
    color: #ffd1dc;
    letter-spacing: 1.5px;
    opacity: 0.85;
    z-index: 50;
    text-shadow: 0 0 8px rgba(255, 143, 163, 0.6);
  }
  .age-badge {
    position: absolute;
    top: 18%;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'VT323', monospace;
    font-size: clamp(38px, 6vw, 70px);
    color: #fff5e1;
    text-shadow:
      0 0 10px #ff4d8d,
      0 0 25px #ff4d8d,
      4px 4px 0 #6b2c5a;
    z-index: 49;
    animation: badgeBounce 2s ease-in-out infinite;
    letter-spacing: 4px;
  }
  @keyframes badgeBounce {
    0%, 100% { transform: translateX(-50%) translateY(0)     rotate(-3deg); }
    50%      { transform: translateX(-50%) translateY(-10px) rotate(3deg); }
  }
</style>

    /* =========================================================

    const starsContainer = document.getElementById('stars');

      s.className = 'star';
      const size = Math.random() * 2.5 + 0.6;

      s.style.height = size + 'px';
      s.style.left = Math.random() * 100 + '%';
      s.style.top  = Math.random() * 100 + '%';
      s.style.animationDuration = (Math.random() * 3 + 2) + 's';
      s.style.animationDelay    = Math.random() * 4 + 's';

      s.style.background = c;
      s.style.color = c;
      starsContainer.appendChild(s);
    }

    /* =========================================================
       Shooting stars
       ========================================================= */
    for (let i = 0; i < 5; i++) {
      const ss = document.createElement('div');

      ss.style.top  = (Math.random() * 50) + '%';

       Confetti rain
       ========================================================= */

      const c = document.createElement('div');

      c.style.borderRadius = Math.random() < 0.5 ? '50%' : '0';
      c.style.width  = (Math.random() * 5 + 4) + 'px';
      c.style.height = (Math.random() * 5 + 4) + 'px';
      c.style.animationDuration = (Math.random() * 6 + 6) + 's';

      const w = Math.max(...art.map(r => r.length));
      const h = art.length;
      const canvas = document.getElementById(canvasId);
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;

        const row = art[y].padEnd(w, '.');

          const c = row[x];

            ctx.fillStyle = palette[c];
            ctx.fillRect(x, y, 1, 1);

    /* Long dark hair w/ caramel bangs, square black glasses,

    ];

    /* girl intentionally not rendered */

    /* =========================================================
       BUTTERFLIES – two frames each
       ========================================================= */
    const bflyPalette = {
      '.': null,
      'P': '#ff8fa3',
      'p': '#fb6f92',
      'D': '#ff4d8d',
      'Y': '#ffe066',
      'O': '#ff8c42',
      'B': '#2a1a17',
      'W': '#ffffff',
    };

    const bflyOpen = [
      "PPP.....PPP",
      "PpDP...PDpP",
      "pDDpB.pDDpD".substring(0,11),
      "PPpDBDpPPpP".substring(0,11),
      "..pYBYp....",
      "...pBp.....",
      "....B......",
      "....B......",
    ];
    // sanitize widths
    const bflyOpen2 = [
      "PPP.....PPP",
      "PpDPB..PDpP",
      "pDDpBDpDDpP",
      "PPpDBDpPDpP",
      "..pYBYp....",
      "...pBp.....",
      "....B......",
      "....B......",
    ];
    const bflyClosed = [
      "...P.B.P...",
      "..PpDBDpP..",
      "..pDDBDDp..",
      "..PpDBDpP..",
      "...pYBYp...",
      "....BBB....",
      "....B......",
      "....B......",
    ];

    renderArt('bfly1a', bflyOpen2,  bflyPalette);
    renderArt('bfly1b', bflyClosed, bflyPalette);
    renderArt('bfly2a', bflyOpen2,  bflyPalette);
    renderArt('bfly2b', bflyClosed, bflyPalette);
    renderArt('bfly3a', bflyOpen2,  bflyPalette);
    renderArt('bfly3b', bflyClosed, bflyPalette);

    /* =========================================================
       Click-to-celebrate – burst of hearts
       ========================================================= */
    document.addEventListener('click', (e) => {
      for (let i = 0; i < 14; i++) {
        const h = document.createElement('div');
        h.textContent = ['♥','✨','★','🎂','🎀'][Math.floor(Math.random()*5)];
        h.style.position = 'absolute';
        h.style.left = e.clientX + 'px';
        h.style.top  = e.clientY + 'px';
        h.style.fontSize = (Math.random() * 14 + 14) + 'px';
        h.style.pointerEvents = 'none';
        h.style.zIndex = 999;
        h.style.color = ['#ff4d8d','#ffd1dc','#ffe066','#fff'][Math.floor(Math.random()*4)];
        h.style.textShadow = '0 0 8px currentColor';
        h.style.transition = 'transform 1.2s ease-out, opacity 1.2s ease-out';
        document.body.appendChild(h);
        const dx = (Math.random() - 0.5) * 240;
        const dy = -(Math.random() * 180 + 60);
        requestAnimationFrame(() => {
          h.style.transform = `translate(${dx}px, ${dy}px) rotate(${(Math.random()-0.5)*360}deg)`;
          h.style.opacity = 0;
        });
        setTimeout(() => h.remove(), 1300);
      }
    });
  </script>
</body>
</html>
