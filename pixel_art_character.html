<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Art - Custom Character</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            background: #2a2a2a;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 90%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            font-weight: 600;
        }
        p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .art-wrapper {
            background-color: #333;
            /* Checkered transparency background */
            background-image: linear-gradient(45deg, #3a3a3a 25%, transparent 25%), 
                              linear-gradient(-45deg, #3a3a3a 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #3a3a3a 75%), 
                              linear-gradient(-45deg, transparent 75%, #3a3a3a 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            padding: 20px;
            border-radius: 8px;
            display: inline-block;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }
        svg {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            max-width: 100%;
            width: 450px;
            height: 450px;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            background: #4a4a4a;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #5a5a5a;
        }
        .btn.active {
            background: #007aff;
        }
    </style>
</head>

<script>
    function changeBg(type, btn) {
        const wrapper = document.getElementById('artWrapper');
        const buttons = document.querySelectorAll('.btn');
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        if (type === 'checkered') {
            wrapper.style.backgroundImage = 'linear-gradient(45deg, #3a3a3a 25%, transparent 25%), linear-gradient(-45deg, #3a3a3a 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #3a3a3a 75%), linear-gradient(-45deg, transparent 75%, #3a3a3a 75%)';
            wrapper.style.backgroundColor = '#333';
        } else if (type === 'light') {
            wrapper.style.backgroundImage = 'none';
            wrapper.style.backgroundColor = '#f5f5f7';
        } else if (type === 'dark') {
            wrapper.style.backgroundImage = 'none';
            wrapper.style.backgroundColor = '#111111';
        }
    }
</script>
